<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORM · Kişisel Program</title>
<meta name="description" content="Kilo verirken kasını koruyan, sana özel antrenman ve beslenme takibi.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f292d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FORM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FORM · kişisel sürüm — tasarım katmanı
   Ağabeyin FORM'unun görsel dili: krem zemin, Fraunces başlık,
   Karla gövde, yüzen alt sekme çubuğu. Vurgu rengi bu sürüme özel.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg1:#f7f0ea; --bg2:#f0e5dd; --bg3:#e8dad0;
  --card:#fffdfb; --card2:#faf4f0; --inset:#ffffff;
  --line:#efe3dc; --line2:#f5ece6;
  --ink:#3b3236; --ink2:#857680; --ink3:#ab9ca3; --ink4:#cdbfc5;
  --acc:#c96a5b; --acc2:#a9503f; --acc-t:#f9e7e2;    /* ana vurgu: kil gülü */
  --grn:#5a9677; --grn2:#3f7559; --grn-t:#e3f0e8;    /* başarı / antrenman */
  --blu:#6d90bb; --blu2:#41668f; --blu-t:#e6eef7;    /* kilo / ölçü */
  --plm:#8b72b2; --plm2:#634d8a; --plm-t:#efeaf7;    /* uyku / toparlanma */
  --amb:#d39536; --amb2:#94650f; --amb-t:#faefdb;    /* uyarı / ipucu */
  --nut:#de9a6a; --nut2:#9c5f27; --nut-t:#fbefe5;    /* beslenme */
  --dark:#2f292d; --on-dark:#fbf3ee;
  --ease:cubic-bezier(.32,.72,0,1);
  --lift:0 1px 2px rgba(70,50,55,.05),0 8px 22px -10px rgba(70,50,55,.22);
  --lift2:0 2px 4px rgba(70,50,55,.06),0 18px 40px -14px rgba(70,50,55,.30);
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);font-size:15px;line-height:1.4;
  background:radial-gradient(140% 90% at 50% 0%,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;
  min-height:100vh;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;letter-spacing:-.3px;line-height:1.15}
input,button,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;background:none;border:0}
a{color:var(--acc2)}
b,strong{font-weight:700}
.num,.inp,.sinp,.kpi b{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding-bottom:calc(112px + env(safe-area-inset-bottom))}

/* ---------- üst şerit ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(250,244,239,.82);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid rgba(239,227,220,.9)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .lg{width:30px;height:30px;flex:none;display:block}
.brand b{display:block;font-size:12px;letter-spacing:2.6px;font-weight:800}
.brand span{display:block;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:11.5px;font-weight:700;color:var(--ink3);padding:6px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);white-space:nowrap;transition:color .2s,border-color .2s,background .2s}
.saved.flash{color:var(--grn2);border-color:#cfe5d8;background:var(--grn-t)}

/* ---------- kartlar ---------- */
.wrap{padding:14px 12px 0}
.card{background:var(--card);border-radius:22px;box-shadow:var(--lift);padding:16px;margin-bottom:14px;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.75);animation:riseIn .34s var(--ease) both}
.card.k{padding-left:19px}
.card.k::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--acc))}
.card.k::after{content:'';position:absolute;inset:0 0 auto 0;height:56px;background:linear-gradient(var(--kt,transparent),transparent);pointer-events:none;opacity:.9}
.card.k > *{position:relative;z-index:1}
.k-acc{--kc:var(--acc);--kt:var(--acc-t);--kh:var(--acc2)}
.k-grn{--kc:var(--grn);--kt:var(--grn-t);--kh:var(--grn2)}
.k-blu{--kc:var(--blu);--kt:var(--blu-t);--kh:var(--blu2)}
.k-plm{--kc:var(--plm);--kt:var(--plm-t);--kh:var(--plm2)}
.k-amb{--kc:var(--amb);--kt:var(--amb-t);--kh:var(--amb2)}
.k-nut{--kc:var(--nut);--kt:var(--nut-t);--kh:var(--nut2)}
.card.k h2{color:var(--kh,var(--ink))}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch h2{font-size:20px}
.ch .meta{font-size:12px;color:var(--ink3);font-weight:600;text-align:right}
.sub{font-size:13.5px;color:var(--ink2)}
.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink3);font-weight:800}
.muted{color:var(--ink3)}
.hint{font-size:12.5px;color:var(--ink2);line-height:1.45}
.hint b{color:var(--ink)}
.sep{height:1px;background:var(--line);margin:14px 0;border:0}
.sep.dash{background:none;border-top:1.5px dashed var(--line)}
.row{display:flex;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.gap6{gap:6px}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mb10{margin-bottom:10px}
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap > .card:nth-child(2){animation-delay:.03s}
.wrap > .card:nth-child(3){animation-delay:.06s}
.wrap > .card:nth-child(4){animation-delay:.09s}
.wrap > .card:nth-child(n+5){animation-delay:.12s}

/* ---------- düğmeler ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:13px 18px;font-weight:800;font-size:15px;
  background:var(--dark);color:var(--on-dark);transition:transform .15s var(--ease),opacity .15s;text-decoration:none;line-height:1.1}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);color:#fff}
.btn.grn{background:var(--grn);color:#fff}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 13px;font-size:13.5px;border-radius:13px}
.btn.wide{width:100%}
.btn.big{padding:17px 20px;font-size:16.5px;border-radius:19px}
.btn[disabled]{opacity:.45;pointer-events:none}
.lnk{color:var(--acc2);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;padding:2px 0}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card2);font-size:13.5px;font-weight:700;color:var(--ink2);transition:all .16s}
.chip.on{background:var(--acc-t);border-color:#ecc3b9;color:var(--acc2)}
.chip.on.g{background:var(--grn-t);border-color:#c4dfcf;color:var(--grn2)}
.chip:active{transform:scale(.96)}
.chip.ab{min-width:48px;font-size:15px;font-weight:800}

/* ---------- gün gezinme ---------- */
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dnav button{height:44px;border-radius:15px;background:var(--card);border:1px solid var(--line);box-shadow:var(--lift);font-weight:800}
.dnav .ar{width:48px;font-size:20px;color:var(--ink2)}
.dnav .ar[disabled]{opacity:.35}
.dnav .lb{flex:1;font-size:14.5px}
.dnav .lb span{color:var(--ink3);font-weight:700;margin-left:6px}

/* ---------- kahraman kartı ---------- */
.hero{padding:18px 18px 16px}
.hero .hl{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.hero h1{font-size:28px;margin:5px 0 4px}
.hero .sub{font-size:14px}
.ring{flex:none;width:84px;height:84px;position:relative}
.ring svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rv b{font-family:'Fraunces',serif;font-size:22px;font-weight:700;line-height:1}
.ring .rv span{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);font-weight:800;margin-top:3px}
.ring circle{transition:stroke-dashoffset .6s var(--ease)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}
.kpi{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:14px;padding:9px 6px 8px;text-align:center;min-width:0}
.kpi b{display:block;font-family:'Fraunces',serif;font-size:18px;font-weight:700;line-height:1.1;white-space:nowrap}
.kpi span{display:block;font-size:10.5px;color:var(--ink2);font-weight:700;margin-top:2px;line-height:1.2}
.kpi.ok b{color:var(--grn2)}
.kpi.over b{color:var(--acc2)}

/* ---------- antrenman çağrısı ---------- */
.cta{display:flex;align-items:center;gap:14px;cursor:pointer}
.cta .ic{width:54px;height:54px;border-radius:17px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--kt);color:var(--kh)}
.cta .ic svg{width:30px;height:30px}
.cta .tx{flex:1;min-width:0}
.cta h3{font-size:19px}
.cta .go{flex:none;font-weight:800;font-size:13.5px;padding:10px 13px;border-radius:13px;background:var(--dark);color:var(--on-dark)}
.cta .go.done{background:var(--grn-t);color:var(--grn2)}

/* ---------- alanlar ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.fld{min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--ink3);font-weight:800;margin-bottom:6px}
.fld label i{font-style:normal;letter-spacing:.2px;text-transform:none;font-weight:700;font-size:12px;white-space:nowrap}
.inp{width:100%;height:54px;border-radius:16px;border:1px solid var(--line);background:var(--inset);font-size:21px;font-weight:700;text-align:center;
  box-shadow:inset 0 1px 2px rgba(70,50,55,.07);outline:none;transition:box-shadow .18s,border-color .18s}
.inp:focus{border-color:#e9c2b8;box-shadow:inset 0 1px 2px rgba(70,50,55,.04),0 0 0 3px rgba(201,106,91,.16)}
.inp::placeholder{color:var(--ink4);font-weight:600}
.inp.txt{text-align:left;padding:0 15px;font-size:17px;font-weight:600}
.inp.sm{height:46px;font-size:17px;border-radius:14px}
select.inp{text-align:left;padding:0 12px;font-size:15px;font-weight:600;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea.inp{height:auto;min-height:84px;padding:12px 14px;text-align:left;font-size:15.5px;font-weight:500;line-height:1.45;resize:vertical}
.fh{font-size:12px;color:var(--ink3);font-weight:600;margin-top:6px;min-height:15px;line-height:1.3}
.fh b{color:var(--ink2)}
.bar{height:6px;border-radius:4px;background:var(--line2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--acc));width:0;transition:width .45s var(--ease),background .3s}
.tgl{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card2);width:100%;text-align:left}
.tgl .sw{width:44px;height:26px;border-radius:13px;background:var(--ink4);position:relative;flex:none;transition:background .2s}
.tgl .sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .22s var(--ease)}
.tgl.on .sw{background:var(--acc)}
.tgl.on .sw::after{transform:translateX(18px)}
.tgl .tt{flex:1;font-weight:700;font-size:14.5px}
.tgl .tt small{display:block;font-weight:500;color:var(--ink2);font-size:12.5px;margin-top:2px}

/* ---------- ipucu kutuları ---------- */
.note{border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.45;background:var(--card2);border:1px solid var(--line);color:var(--ink)}
.note.amb{background:var(--amb-t);border-color:#f0dcb4}
.note.grn{background:var(--grn-t);border-color:#c9e2d3}
.note.acc{background:var(--acc-t);border-color:#f0cfc6}
.note.blu{background:var(--blu-t);border-color:#cddcee}
.note b{font-weight:800}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ti{width:34px;height:34px;border-radius:11px;background:var(--amb-t);color:var(--amb2);display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}

/* ---------- antrenman ---------- */
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px 12px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.stp{flex:none;min-width:42px;height:42px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:800;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:var(--lift);font-size:14px}
.stp.on{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.stp.ok{background:var(--grn-t);color:var(--grn2);border-color:#c4dfcf}
.stp.ok.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.stp svg{width:16px;height:16px}
.exh{display:flex;gap:14px;align-items:center}
.fig{width:112px;height:94px;border-radius:18px;background:var(--card2);border:1px solid var(--line);flex:none;padding:4px;position:relative}
.fig .zm{position:absolute;right:6px;bottom:5px;width:20px;height:20px;border-radius:7px;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.fig .zm svg{width:12px;height:12px}
.exh h2{font-size:23px;margin:3px 0 4px}
.exh .meta{font-size:13.5px;color:var(--ink2);font-weight:700}
.mus{font-size:12px;color:var(--ink3);font-weight:700;margin-top:3px}
.sug{margin-top:14px;display:flex;gap:10px;align-items:flex-start}
.sug .si{width:28px;height:28px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.sug.up .si{background:var(--grn-t);color:var(--grn2)}
.sug.same .si{background:var(--blu-t);color:var(--blu2)}
.sug.down .si{background:var(--amb-t);color:var(--amb2)}
.sug.first .si{background:var(--acc-t);color:var(--acc2)}
.sug p{font-size:14px;line-height:1.45;padding-top:4px}
.prev{font-size:12.5px;color:var(--ink2);margin-top:10px;padding:9px 12px;background:var(--card2);border-radius:12px;border:1px solid var(--line2)}
.prev b{color:var(--ink)}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:24px 1fr 34px 1fr 56px;gap:6px;align-items:center}
.srow .sn{font-weight:800;color:var(--ink3);text-align:center;font-size:14px}
.srow .x{text-align:center;font-size:12px;font-weight:800;color:var(--ink3);line-height:1.1}
.sinp{width:100%;height:52px;border-radius:15px;border:1px solid var(--line);background:var(--inset);text-align:center;font-size:21px;font-weight:700;outline:none;
  box-shadow:inset 0 1px 2px rgba(70,50,55,.07);min-width:0}
.sinp:focus{border-color:#e9c2b8;box-shadow:0 0 0 3px rgba(201,106,91,.16)}
.sinp::placeholder{color:var(--ink4);font-weight:700}
.sok{height:52px;border-radius:15px;border:1.5px solid var(--line);background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--ink4);transition:all .18s var(--ease)}
.sok svg{width:24px;height:24px}
.srow.lv{grid-template-columns:24px 1.45fr 16px 1fr 56px}
select.sel{-webkit-appearance:none;appearance:none;font-size:15px;font-weight:800;text-align:center;text-align-last:center;padding:0 6px;color:var(--ink)}
.srow.done .sok{background:var(--grn);border-color:var(--grn);color:#fff}
.srow.done .sinp{background:var(--grn-t);border-color:#c4dfcf;color:var(--grn2)}
.srow .del{color:var(--ink4);font-size:18px;height:52px}
.addset{margin-top:10px;font-size:13px;font-weight:800;color:var(--ink2);padding:8px 12px;border-radius:12px;border:1px dashed var(--ink4)}
details.how{margin-top:14px;border-top:1.5px dashed var(--line);padding-top:12px}
details.how summary{list-style:none;font-weight:800;font-size:14.5px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:'+';font-size:20px;color:var(--ink3);font-weight:600;line-height:1}
details.how[open] summary::after{content:'–'}
ol.how-l{margin:10px 0 0 0;padding:0;list-style:none;counter-reset:h}
ol.how-l li{counter-increment:h;position:relative;padding-left:32px;margin-bottom:9px;font-size:14px;line-height:1.45}
ol.how-l li::before{content:counter(h);position:absolute;left:0;top:-1px;width:23px;height:23px;border-radius:8px;background:var(--acc-t);color:var(--acc2);
  font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.kv{display:flex;gap:8px;font-size:13.5px;line-height:1.45;margin-top:8px}
.kv b{flex:none}
.vid{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-weight:800;font-size:13.5px;color:var(--acc2);text-decoration:none;
  padding:9px 13px;border-radius:13px;background:var(--acc-t)}
.vid svg{width:16px;height:16px}
.pager{display:flex;gap:8px;margin-top:4px}
.pager .btn{flex:1}
.hold{font-size:12px;color:var(--ink3);text-align:center;margin-top:8px}

/* ---------- dinlenme sayacı ---------- */
#restbar{position:fixed;left:50%;transform:translate(-50%,24px);opacity:0;visibility:hidden;pointer-events:none;bottom:calc(94px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:536px;z-index:45;
  background:var(--dark);color:var(--on-dark);border-radius:20px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 14px 34px -10px rgba(40,25,30,.55);transition:transform .32s var(--ease),opacity .25s,visibility .25s,background .3s;overflow:hidden}
#restbar.on{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto}
#restbar .rbt{flex:1;min-width:0}
#restbar .rbt small{display:block;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;opacity:.7;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#restbar .rbv{font-family:'Fraunces',serif;font-size:27px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
#restbar button{height:42px;padding:0 13px;border-radius:13px;background:rgba(255,255,255,.12);color:inherit;font-weight:800;font-size:13.5px;flex:none}
#restbar .rbp{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0}
#restbar.end{background:var(--grn)}
#restbar.end .rbp{display:none}

/* ---------- alt sekme çubuğu ---------- */

.setup{max-width:560px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top)) 12px calc(40px + env(safe-area-inset-bottom))}

code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--card2);padding:1px 5px;border-radius:6px;border:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media(min-width:600px){.wrap{padding-top:20px}}

<script>
"use strict";
(function(){
/* ============================================================
   FORM · kişisel sürüm
   Tek dosya uygulama: veriler bu telefondaki tarayıcıda (localStorage)
   durur. İsteğe bağlı: yedek dosyası, GitHub Gist ile bulut yedeği,
   dinlenme bildirimi (ağabeyin FORM sunucusu üzerinden).
   ============================================================ */
var VER='1.1 · 7 Kas 2026';
var KEY='fk:data';          /* ana veri — ağabeyin FORM'u 'emre:form:*' kullanıyor, çakışmaz */
var DEVKEY='fk:device';     /* yalnız bu cihaza ait: bildirim aboneliği, son yedek tarihi … */
var PUSHURL='https://form-timer.yurugagarin.workers.dev';

/* ============ TARİH ============ */
var AY=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
var AYU=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var GUN=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
var GUNU=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
var WEEKORDER=[1,2,3,4,5,6,0];

function pad2(n){return (n<10?'0':'')+n;}
function ds(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function pd(s){var a=String(s).split('-');return new Date(+a[0],+a[1]-1,+a[2],12,0,0);}
function today(){return ds(new Date());}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d);}
function dayDiff(a,b){return Math.round((pd(b)-pd(a))/864e5);}
function dow(s){return pd(s).getDay();}
function monday(s){return addD(s,-((dow(s)+6)%7));}
function fdate(s){var d=pd(s);return d.getDate()+' '+AY[d.getMonth()];}
function fdateD(s){var d=pd(s);return GUN[d.getDay()]+' '+d.getDate()+' '+AY[d.getMonth()];}
function fdateL(s){var d=pd(s);return GUNU[d.getDay()]+', '+d.getDate()+' '+AYU[d.getMonth()];}
function isValidDs(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s||''));}

/* ============ SAYI ============ */
function fx(v,dec){
  if(v==null||!isFinite(v))return '—';
  dec=dec||0;
  try{return Number(v).toLocaleString('tr-TR',{minimumFractionDigits:dec,maximumFractionDigits:dec});}
  catch(e){return Number(v).toFixed(dec).replace('.',',');}
}
/* kilo: 62 → "62", 62,5 → "62,5" */
function fk(v){if(v==null||!isFinite(v))return '—';var r=Math.round(v*10)/10;return fx(r,r%1?1:0);}
function fk1(v){return fx(v,1);}
function sign(v,dec){if(v==null||!isFinite(v))return '—';var s=fx(Math.abs(v),dec==null?1:dec);return (v>0.0001?'+':v<-0.0001?'−':'')+s;}
/* Türkçe klavyede ondalık virgül: "62,5" → 62.5 */
function num(s){
  if(s==null)return null;
  s=String(s).trim().replace(/\s/g,'');
  if(!s)return null;
  s=s.replace(/,/g,'.');
  var parts=s.split('.');
  if(parts.length>2)s=parts.slice(0,-1).join('')+'.'+parts[parts.length-1];
  var v=parseFloat(s);
  return isFinite(v)?v:null;
}
/* tam sayı: "8.500" → 8500 (nokta binlik ayıracı) */
function int(s){if(s==null)return null;s=String(s).replace(/[^\d]/g,'');if(!s)return null;var v=parseInt(s,10);return isFinite(v)?v:null;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function round5(v){return Math.round(v/5)*5;}
function round10(v){return Math.round(v/10)*10;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function mmss(x){x=Math.max(0,Math.round(x));var m=Math.floor(x/60),s=x%60;return m+':'+pad2(s);}

/* ============ DURUM ============ */
var DEF={
  app:'form-kardes', v:1,
  profile:{name:'',age:null,height:null,startWeight:null,goalWeight:null,startDate:null},
  maint:null, maintSrc:'',
  targets:{kcal:null,protein:null,steps:10000,sleep:7.5,kcalAuto:true,protAuto:true},
  gymDays:[1,3,5],
  mode:'ev',          /* 'ev' | 'salon' — antrenman programı */
  modeStart:{},       /* her programa ilk geçiş tarihi (öğrenme dönemi buna göre) */
  cycle:true,
  days:{},
  sync:{token:'',gist:'',last:0},
  _st:0
};
var S=null, DEV={};
function normalize(){
  var d=clone(DEF);
  Object.keys(d).forEach(function(k){if(S[k]===undefined||S[k]===null&&typeof d[k]==='object'&&d[k]!==null)S[k]=d[k];});
  ['profile','targets','sync'].forEach(function(k){
    if(!S[k]||typeof S[k]!=='object')S[k]=d[k];
    Object.keys(d[k]).forEach(function(j){if(S[k][j]===undefined)S[k][j]=d[k][j];});
  });
  if(!Array.isArray(S.gymDays))S.gymDays=d.gymDays;
  if(!S.days||typeof S.days!=='object')S.days={};
  if(S.mode!=='ev'&&S.mode!=='salon')S.mode='ev';
  if(!S.modeStart||typeof S.modeStart!=='object')S.modeStart={};
  if(S.profile.startDate&&!S.modeStart[S.mode])S.modeStart[S.mode]=S.profile.startDate;
}
function load(){
  try{var t=localStorage.getItem(KEY);S=t?JSON.parse(t):null;}catch(e){S=null;}
  if(!S||typeof S!=='object')S=clone(DEF);
  normalize();
  try{DEV=JSON.parse(localStorage.getItem(DEVKEY)||'{}')||{};}catch(e){DEV={};}
}
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,300);}
function saveNow(){
  clearTimeout(saveT);saveT=null;
  try{localStorage.setItem(KEY,JSON.stringify(S));flashSaved();}
  catch(e){toast('Kaydedilemedi: '+(e&&e.message||e));}
  if(syncOn())schedulePush();
}
function saveDev(){try{localStorage.setItem(DEVKEY,JSON.stringify(DEV));}catch(e){}}
function touchSettings(){S._st=Date.now();save();}

/* gün kaydı: okumak için D, yazmak için DW (yazınca zaman damgası güncellenir → bulut birleştirmede yeni olan kazanır) */
function D(d){return S.days[d]||null;}
function DW(d){var x=S.days[d];if(!x)x=S.days[d]={};x._t=Date.now();return x;}
function dv(d,k){var x=S.days[d];return x&&x[k]!=null?x[k]:null;}
function dayKeys(){return Object.keys(S.days).filter(isValidDs).sort();}

/* ============ GÖRÜNÜM DURUMU ============ */
var TAB='bugun', cur=today(), exIdx=0, progRange=90, typing=false, pendingRender=false;
var app=document.getElementById('app');

var toastT=null;
function toast(m,ms){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},ms||1900);}
var savedT=null;
function flashSaved(){
  var el=document.getElementById('saved');if(!el)return;
  el.textContent='kaydedildi ✓';el.classList.add('flash');
  clearTimeout(savedT);savedT=setTimeout(function(){el.classList.remove('flash');el.textContent=badgeText();},1300);
}
function badgeText(){
  if(syncOn()){
    if(syncMsg)return syncMsg;
    if(!S.sync.last)return 'bulut bağlı';
    var m=Math.round((Date.now()-S.sync.last)/60000);
    return m<1?'bulutta ✓':(m<60?'bulut · '+m+' dk':'bulut · '+Math.round(m/60)+' sa');
  }
  return 'bu telefonda';
}
function isIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function standalone(){try{return navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;}catch(e){return false;}}

/* ============================================================
   PROGRAM — yeni başlayan bir kadın için: yağ yakarken kası korumak
   ------------------------------------------------------------
   Ağabeyin FORM'unun 100 sürümünde öğrenilenler baştan uygulandı:
   • Ayrı karın hareketi YOK. Karın squat, hip thrust ve preslerde zaten
     stabilizatör olarak çalışıyor; haftada birkaç set karın anlamlı uyarım değil.
   • Kardiyo YOK. Kardiyo = günlük adım hedefi. Salonda koşu bandı yok.
   • Romanian deadlift YOK. Öğrenmesi en zor, bele yük bindiren hareket (ağabeyde
     bel ağrısı yaptı). Kalça menteşesi yerine bel dostu 45° sırt ekstansiyonu.
   • Aynı işi yapan ikinci hareket YOK: her seansta her hareket kalıbı bir kez —
     diz baskın, kalça, çekiş, itiş, bir izolasyon.
   • Tekrar aralıkları: bileşik 8–12 / 10–15, izolasyon 12–15. 20 tekrarlık set yok;
     onları kas değil yanma bitiriyordu.
   • Sabit yörüngeli makine ve kablo ağırlıklı: form kovalanmaz, yardımcı gerekmez.
   Yapı: haftada 3 gün TAM VÜCUT, A ve B sırayla (A-B-A, sonraki hafta B-A-B).
   Hafta 1–2 öğrenme: hareket başına 2 set. Hafta 3'ten sonra 3 set.
   Seans: 5 hareket, ~45 dk. İlerleme: çift ilerleme (bütün setler üst sınıra
   ulaşınca kilo bir kademe artar).
   ============================================================ */
var EX={
 legpress:{n:'Leg press',en:'leg press machine proper form',fig:'legPress',r:[10,15],rest:120,step:5,
   mus:'Ön bacak · kalça · arka bacak',
   why:'Bacak ve kalçayı ağır ama güvenle yüklemenin en kolay yolu. Bel yük taşımaz, denge gerekmez.',
   how:['Sırtını ve kalçanı sedyeye tam yasla. Ayaklar platformun ortasında, omuz genişliğinde.',
        'Kilidi aç, dizlerini göğsüne doğru yavaşça indir (yaklaşık 90°).',

 hipthrust:{n:'Hip thrust',en:'hip thrust machine for beginners',fig:'hipThrust',r:[8,12],rest:120,step:5,

   why:'Kalçayı en doğrudan çalıştıran hareket. Bele yük bindirmez.',

   warn:'Tepede belini kavislendirme; hareket kalçadan gelsin. Çenen hafif göğsüne doğru dursun.',
   alt:'Smith makinesinde hip thrust.'},
 pulldown:{n:'Lat pulldown',en:'lat pulldown proper form',fig:'pulldown',r:[8,12],rest:90,step:2.5,
   mus:'Sırt (kanatlar) · arka omuz · ön kol',
   why:'Sırtı çalıştırır, duruşu dikleştirir; bel daha ince görünür.',

/* ============ PROGRAM HESAPLARI ============ */
function weekNo(d){if(!S.profile.startDate)return 1;var n=dayDiff(S.profile.startDate,d);return n<0?0:Math.floor(n/7)+1;}
/* ev / salon: günün antrenmanı hangi programdan? Set girilmiş ya da geçmiş günde kaydedilen
   mod; yoksa şu anki mod. Eski (mod alanı olmayan) kayıtlar hareket adlarından anlaşılır. */
function woModeOf(w){if(w&&w.mode)return w.mode;if(w&&w.sets&&Object.keys(w.sets).some(function(k){return k.indexOf('e_')===0;}))return 'ev';return 'salon';}
function modeFor(d){var w=woOf(d);if(w&&(woAny(w)||d<today()))return woModeOf(w);return S.mode||'ev';}
function modeStart(m){return (S.modeStart&&S.modeStart[m])||S.profile.startDate||today();}
/* öğrenme dönemi her program için ayrı: salona geçince yeni makineler için 2 hafta yeniden */
function learning(d){return dayDiff(modeStart(modeFor(d)),d)<14;}
function setsFor(d){return learning(d)?2:3;}
function isGymDay(d){return S.gymDays.indexOf(dow(d))>=0;}
function woOf(d){var x=S.days[d];return x&&x.wo?x.wo:null;}
function setsOf(d,id){var w=woOf(d);return w&&w.sets&&w.sets[id]?w.sets[id]:[];}
function okSets(arr){return (arr||[]).filter(function(s){return s&&s.ok&&s.rep>0&&s.kg!=null;});}
function woAny(w){return !!(w&&w.sets&&Object.keys(w.sets).some(function(k){return EX[k]&&okSets(w.sets[k]).length>0;}));}
/* yapılmış antrenman günleri (en az bir onaylı set) */
function woDays(){return dayKeys().filter(function(d){return woAny(woOf(d));});}
function lastWoBefore(d){var l=null;woDays().forEach(function(k){if(k<d)l=k;});return l;}
/* A/B sırası takvime değil yapılan antrenmanlara göre: kaçırılan gün sırayı bozmaz.
   Evden salona geçince de sıra devam eder. */
function woTypeFor(d){
  var w=woOf(d);if(w&&(w.type==='A'||w.type==='B'))return w.type;
  var l=lastWoBefore(d);if(!l)return 'A';
  return woOf(l).type==='A'?'B':'A';
}
function WOD(d,ty){return PROG[modeFor(d)][ty||woTypeFor(d)];}
function modeIds(m){var o=[];['A','B'].forEach(function(t){PROG[m][t].ex.forEach(function(id){if(o.indexOf(id)<0)o.push(id);});});return o;}
function exDone(d,id){return okSets(setsOf(d,id)).length>=setsFor(d);}
function woProg(d){var ty=woTypeFor(d),ids=WOD(d,ty).ex,n=0;ids.forEach(function(id){if(exDone(d,id))n++;});return {n:n,total:ids.length,type:ty};}
function woFinished(d){var w=woOf(d);if(!w)return false;if(w.done)return true;var p=woProg(d);return p.n>=p.total;}
function nextGymDay(from){for(var i=0;i<8;i++){var d=addD(from,i);if(isGymDay(d))return d;}return null;}

/* ============ GÜÇ HESABI ============ */
/* tahmini 1 tekrar maksimum (Epley): 20 kg×12 ile 22,5 kg×9 karşılaştırılabilsin.
   Sırt ekstansiyonunda vücudun üst yarısı da yüktür: sabit bir pay eklenir (kıyas için). */
function bwRef(){return S.profile.startWeight||weightSeries().map(function(p){return p.v;})[0]||65;}
function optOf(id,s){var e=EX[id];if(!e||!e.opts)return null;var o=s&&s.o!=null?+s.o:null;return o!=null&&e.opts[o]?e.opts[o]:null;}
function effLoad(id,s){
  var e=EX[id],o=optOf(id,s);
  if(o)return ((o.kg||0)+bwRef()*(o.bw!=null?o.bw:(e.bwAdd||0)))*(o.x||1);
  return (+s.kg||0)+(e&&e.bwAdd?bwRef()*e.bwAdd:0);
}
function e1(kg,rep){return kg*(1+rep/30);}
function sessVal(id,sets){
  var ok=okSets(sets);if(!ok.length)return null;
  var b=0;ok.forEach(function(s){var v=e1(effLoad(id,s),s.rep);if(v>b)b=v;});return b>0?b:null;
}
function exHist(id){
  var out=[];
  dayKeys().forEach(function(d){
    var w=woOf(d);if(!w||!w.sets||!w.sets[id])return;
    var v=sessVal(id,w.sets[id]);if(v!=null)out.push({d:d,v:v,sets:okSets(w.sets[id])});
  });
  return out;
}
function prevSess(id,d){var h=exHist(id).filter(function(x){return x.d<d;});return h.length?h[h.length-1]:null;}
function kgLabel(id,kg){return (+kg===0&&EX[id].bwAdd)?'ağırlıksız':fk(kg)+' kg';}
/* aynı kilodaki setleri grupla: "25 kg × 12 · 12 · 11" */
function setsStr(id,sets){
  var e=EX[id];
  if(e&&e.opts){
    var go=[],lo=null;
    sets.forEach(function(s){var o=+s.o||0;if(lo&&lo.o===o)lo.r.push(s.rep);else{lo={o:o,r:[s.rep]};go.push(lo);}});
    return go.map(function(x){return e.opts[x.o].s+' × '+x.r.join(' · ');}).join(' / ');
  }
  var g=[],last=null;
  sets.forEach(function(s){var k=+s.kg||0;if(last&&last.kg===k)last.r.push(s.rep);else{last={kg:k,r:[s.rep]};g.push(last);}});
  return g.map(function(x){return kgLabel(id,x.kg)+' × '+x.r.join(' · ');}).join(' / ');
}
function topKg(sets){var t=0;sets.forEach(function(s){if((+s.kg||0)>t)t=+s.kg||0;});return t;}
/* bu seansta ne denensin? (çift ilerleme) */
function suggest(d,id){
  var e=EX[id];if(e.opts)return suggestLv(d,id);
  var h=exHist(id).filter(function(x){return x.d<d;}),p=h.length?h[h.length-1]:null,lo=e.r[0],hi=e.r[1];
  if(!p){
    if(e.bwAdd)return {k:'first',kg:0,rep:lo,msg:'İlk kez yapıyorsun: ağırlıksız başla. Hareketi yavaş ve kontrollü öğren.'};
    return {k:'first',kg:null,rep:hi,msg:learning(d)
      ?'İlk kez yapıyorsun: rahatça 15 kez kaldırabileceğin hafif bir ağırlık seç. Bugün amaç hareketi öğrenmek, kilo değil.'
      :'İlk kez yapıyorsun: '+lo+'–'+hi+' tekrarı zorlanarak ama düzgün formla yapabileceğin bir ağırlık seç.'};
  }
  var top=topKg(p.sets),ws=p.sets.filter(function(s){return (+s.kg||0)===top;}),reps=ws.map(function(s){return s.rep;});
  var allTop=ws.length>=setsFor(p.d)&&reps.every(function(r){return r>=hi;});
  if(allTop){
    var nk=Math.round((top+e.step)*10)/10;
    return {k:'up',kg:nk,rep:lo,msg:'Geçen sefer bütün setlerde '+hi+' tekrar yaptın. Bugün <b>'+kgLabel(id,nk)+'</b> dene; '+lo+' tekrar yeterli.'};
  }
  var first=reps[0];
  if(first<lo){
    var p2=h.length>1?h[h.length-2]:null,below2=false;
    if(p2){var t2=topKg(p2.sets),f2=p2.sets.filter(function(s){return (+s.kg||0)===t2;})[0];below2=t2===top&&f2&&f2.rep<lo;}
    if(below2&&top>0){var dk=Math.max(0,Math.round((top-e.step)*10)/10);
      return {k:'down',kg:dk,rep:lo,msg:'İki seanstır '+lo+' tekrara ulaşamadın. Bugün bir kademe hafiflet: <b>'+kgLabel(id,dk)+'</b>. Formunu koru.'};}
    return {k:'same',kg:top,rep:lo,msg:'Geçen sefer zorlandın. Aynı kiloda kal (<b>'+kgLabel(id,top)+'</b>) ve '+lo+' tekrara ulaşmaya çalış.'};
  }
  return {k:'same',kg:top,rep:Math.min(hi,first+1),msg:'Aynı kilo (<b>'+kgLabel(id,top)+'</b>), bir tekrar fazlasını dene. Bütün setlerde '+hi+' olunca kilo artacak.'};
}

/* evde: kilo yerine seviye (ağırlıksız → 6 kg → 2×6 kg → tek bacak / yavaş tempo) */
function topO(sets){var t=0;sets.forEach(function(s){if((+s.o||0)>t)t=+s.o||0;});return t;}
function suggestLv(d,id){
  var e=EX[id],h=exHist(id).filter(function(x){return x.d<d;}),p=h.length?h[h.length-1]:null,lo=e.r[0],hi=e.r[1],L=e.opts.length;
  if(!p){var o0=e.o0||0;
    return {k:'first',o:o0,rep:lo,msg:'İlk kez yapıyorsun: <b>'+e.opts[o0].n+'</b> ile başla. '+(learning(d)?'Bugün amaç hareketi öğrenmek; yavaş ve kontrollü.':lo+'–'+hi+' tekrarı düzgün formla hedefle.')+(o0>0?' Zor gelirse bir alt seviyeyi seç.':'')};}
  var top=topO(p.sets),ws=p.sets.filter(function(s){return (+s.o||0)===top;}),reps=ws.map(function(s){return s.rep;});
  var allTop=ws.length>=setsFor(p.d)&&reps.every(function(r){return r>=hi;});
  if(allTop){
    if(top<L-1)return {k:'up',o:top+1,rep:lo,msg:'Geçen sefer bütün setlerde '+hi+' tekrar yaptın. Bugün bir üst seviye: <b>'+e.opts[top+1].n+'</b>; '+lo+' tekrar yeterli.'};
    return {k:'same',o:top,rep:hi,msg:'Evdeki en zor seviyedesin ve '+hi+' tekrarı geçtin. Tekrarları daha yavaş yap. Salona geçince bu hareket ağırlıkla ilerlemeye devam eder.'};
  }
  var first=reps[0];
  if(first<lo){
    var p2=h.length>1?h[h.length-2]:null,below2=false;
    if(p2){var t2=topO(p2.sets),f2=p2.sets.filter(function(s){return (+s.o||0)===t2;})[0];below2=t2===top&&f2&&f2.rep<lo;}
    if(below2&&top>0)return {k:'down',o:top-1,rep:lo,msg:'İki seanstır '+lo+' tekrara ulaşamadın. Bugün bir alt seviye: <b>'+e.opts[top-1].n+'</b>. Formunu koru.'};
    return {k:'same',o:top,rep:lo,msg:'Geçen sefer zorlandın. Aynı seviyede kal (<b>'+e.opts[top].n+'</b>) ve '+lo+' tekrara ulaşmaya çalış.'};
  }
  return {k:'same',o:top,rep:Math.min(hi,first+1),msg:'Aynı seviye (<b>'+e.opts[top].n+'</b>), bir tekrar fazlasını dene. Bütün setlerde '+hi+' olunca bir üst seviyeye geçeceksin.'};
}

  return '<polyline points="'+pts+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"'+(k==='g'?' stroke-dasharray="4.5 4.5"':'')+'/>';}

  ?'<circle cx="'+x+'" cy="'+y+'" r="6.5" fill="none" stroke="'+FI.gh+'" stroke-width="3" stroke-dasharray="4 4"/>'
  :'<circle cx="'+x+'" cy="'+y+'" r="7" fill="'+FI.ink+'"/>';}

  '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+FI.ps+'" stroke-width="1.6" stroke-linecap="round"/>';}
function AR(d){return '<path d="'+d+'" fill="none" stroke="'+FI.ar+'" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ah)"/>';}

/* bakım kalorisi (Mifflin-St Jeor, kadın): 10·kg + 6,25·cm − 5·yaş − 161, sonra aktivite çarpanı */
var ACT=[
  [1.375,'Masa başı, günde 5 binden az adım','haftada 3 gün spor dahil'],
  [1.46,'Günde 6–8 bin adım','haftada 3 gün spor dahil'],
  [1.55,'Günde 10 bin üstü adım ya da ayakta iş','haftada 3 gün spor dahil'],
  [1.7,'Fiziksel iş, gün boyu hareketli','haftada 3 gün spor dahil']
];
function bmr(w,h,a){return 10*w+6.25*h-5*a-161;}
function calcMaint(w,h,a,f){if(!w||!h||!a||!f)return null;return round10(bmr(w,h,a)*f);}
/* hedef: bakımın %20 altı, en çok 500 kcal açık (≈ haftada 0,45 kg), en az 1300 kcal */
function suggestKcal(m){if(!m)return null;var def=Math.min(500,m*0.2);return Math.min(round10(m-100),Math.max(1300,round10(m-def)));}
/* protein: hedef kilonun ×1,8'i (hedef yoksa şu anki kilonun ×1,5'i), 80–150 g arası */
function suggestProtein(){
  var p=S.profile,g=p.goalWeight,c=lastWeight()||p.startWeight;
  if(g)return clamp(round5(g*1.8),80,150);
  if(c)return clamp(round5(c*1.5),80,150);
  return 100;
}
function autoTargets(){
  if(S.targets.kcalAuto)S.targets.kcal=suggestKcal(S.maint);
  if(S.targets.protAuto)S.targets.protein=suggestProtein();
}

/* ============ KİLO ============ */
function weightSeries(){
  var out=[];dayKeys().forEach(function(d){var v=dv(d,'w');if(v!=null&&v>=30&&v<=250)out.push({d:d,v:v});});
  return out;
}
function lastWeight(){var w=weightSeries();return w.length?w[w.length-1].v:null;}
/* trend kilo: üssel ortalama. Tartılmayan gün nokta üretmez; ara ne kadar uzunsa yeni ölçüm o kadar söz sahibi olur. */
function trendSeries(){
  var raw=weightSeries(),out=[],e=null,prev=null,a0=0.22;
  raw.forEach(function(p){
    if(e==null)e=p.v;
    else{var gap=Math.max(1,dayDiff(prev,p.d));var a=1-Math.pow(1-a0,gap);e=a*p.v+(1-a)*e;}
    prev=p.d;out.push({d:p.d,v:e,raw:p.v});
  });
  return out;
}
function trendNow(){var t=trendSeries();return t.length?t[t.length-1].v:null;}
function trendAt(d){var t=trendSeries(),v=null;t.forEach(function(p){if(p.d<=d)v=p.v;});return v;}
/* hız: ham tartılara doğrusal regresyon (kg/hafta). En az 4 tartı ve 10 günlük aralık. */
function slopeFit(w){
  if(!w||w.length<4)return null;
  var span=dayDiff(w[0].d,w[w.length-1].d)+1;if(span<10)return null;
  var n=w.length,sx=0,sy=0,sxy=0,sxx=0;
  w.forEach(function(p){var x=dayDiff(w[0].d,p.d);sx+=x;sy+=p.v;sxy+=x*p.v;sxx+=x*x;});
  var den=n*sxx-sx*sx;if(!den)return null;
  var b=(n*sxy-sx*sy)/den;
  return {slope:b*7,n:n,span:span,from:w[0].d,to:w[w.length-1].d};
}
function slopeInfo(days,end){
  var ws=weightSeries();end=end||today();
  var from=addD(end,-((days||21)-1));
  return slopeFit(ws.filter(function(x){return x.d>=from&&x.d<=end;}));
}
function startW(){var p=S.profile;if(p.startWeight)return p.startWeight;var w=weightSeries();return w.length?w[0].v:null;}
function lostKg(){var b=startW(),t=trendNow();return b!=null&&t!=null?b-t:null;}

/* haftalık ortalamalar (Pzt–Paz) */
function weeks(n){
  var out=[],end=monday(today());
  for(var i=n-1;i>=0;i--){
    var ms=addD(end,-7*i),ws=[],ks=[],st=[],wo=0,pr=[];
    for(var j=0;j<7;j++){var d=addD(ms,j);if(d>today())break;var x=S.days[d];if(!x)continue;
      if(x.w!=null&&x.w>=30)ws.push(x.w);if(x.kcal)ks.push(x.kcal);if(x.steps!=null)st.push(x.steps);if(x.prot)pr.push(x.prot);if(woAny(x.wo))wo++;}
    out.push({ms:ms,w:avg(ws),nw:ws.length,k:avg(ks),s:avg(st),p:avg(pr),wo:wo});
  }
  return out;
}
function avg(a){if(!a.length)return null;var s=0;a.forEach(function(v){s+=v;});return s/a.length;}

/* gerçek bakım kalorisi: ortalama alım + (haftalık kilo kaybı × 7700 ÷ 7). Son 28 gün. */
var KCAL_PER_KG=7700;
function realMaint(){
  var end=today(),from=addD(end,-27),ks=[];
  for(var i=0;i<28;i++){var d=addD(from,i),k=dv(d,'kcal');if(k&&k>=600)ks.push(k);}
  var si=slopeInfo(28,end);
  if(ks.length<14||!si||si.n<8||si.span<14)return null;
  var m=avg(ks)-si.slope*KCAL_PER_KG/7;
  if(m<1100||m>4000)return null;
  return {v:round10(m),k:avg(ks),slope:si.slope,days:ks.length};
}

/* ============ GÜNÜN HEDEFLERİ ============ */
function dayGoals(d){
  var x=S.days[d]||{},t=S.targets,g=[];
  if(t.kcal)g.push({k:'kcal',n:'Kalori',ok:!!(x.kcal&&x.kcal<=t.kcal*1.03),has:!!x.kcal});
  if(t.protein)g.push({k:'prot',n:'Protein',ok:!!(x.prot&&x.prot>=t.protein*0.9),has:!!x.prot});
  if(t.steps)g.push({k:'steps',n:'Adım',ok:!!(x.steps&&x.steps>=t.steps),has:x.steps!=null});
  if(isGymDay(d)||woAny(x.wo))g.push({k:'wo',n:'Antrenman',ok:woFinished(d)||woProg(d).n>=Math.ceil(woProg(d).total*0.66),has:woAny(x.wo)});
  var n=0;g.forEach(function(q){if(q.ok)n++;});
  return {list:g,n:n,total:g.length};
}
function logged(d){var x=S.days[d];if(!x)return false;return x.w!=null||!!x.kcal||x.steps!=null||!!x.prot||woAny(x.wo);}
/* kayıt serisi: bugün (ya da bugün henüz boşsa dün) geriye doğru kesintisiz kayıtlı gün */
function streak(){
  var d=today(),n=0;if(!logged(d))d=addD(d,-1);
  while(logged(d)){n++;d=addD(d,-1);if(n>3650)break;}
  return n;
}
function bestStreak(){
  var ks=dayKeys().filter(logged),b=0,c=0,prev=null;
  ks.forEach(function(d){c=(prev&&dayDiff(prev,d)===1)?c+1:1;if(c>b)b=c;prev=d;});
  return b;
}
function plannedSince(){
  var s=S.profile.startDate;if(!s)return 0;var n=0,d=s,t=today();
  /* bugün henüz yapılmadıysa sayılmaz: "14/16" gün bitmeden eksik görünmesin */
  while(d<t){if(isGymDay(d))n++;d=addD(d,1);if(n>2000)break;}
  if(woAny(woOf(t)))n++;
  return n;
}

/* ============ GÜÇ / KAS KORUMA ============ */
/* her hareketin ilk seansına göre güç oranı; endeks = ortalama */
function strength(){
  var rows=[],idx=[];
  var ids=modeIds(S.mode);
  ids.forEach(function(id){
    var h=exHist(id);if(!h.length)return;
    var f=h[0],l=h[h.length-1],best=0;h.forEach(function(x){if(x.v>best)best=x.v;});
    rows.push({id:id,first:f,last:l,best:best,n:h.length,pct:h.length>1?(l.v/f.v-1)*100:null});
  });
  /* endeks çizgisi: her antrenman gününde, o güne kadarki son değer / ilk değer */
  var dates=woDays().filter(function(d){return woModeOf(woOf(d))===S.mode;});
  dates.forEach(function(d){
    var r=[];
    ids.forEach(function(id){
      var h=exHist(id).filter(function(x){return x.d<=d;});
      if(h.length>=1)r.push(h[h.length-1].v/h[0].v);
    });
    if(r.length)idx.push({d:d,v:avg(r)*100});
  });
  var have=rows.filter(function(r){return r.n>1;});
  var avgPct=have.length?avg(have.map(function(r){return r.pct;})):null;
  /* son 3 seansta belirgin düşüş var mı (en iyinin %8 altı)? */
  var drops=rows.filter(function(r){return r.n>=3&&r.last.v<r.best*0.92;});
  return {rows:rows,idx:idx,avgPct:avgPct,n:have.length,drops:drops};
}
/* rekorlar: seans değeri o hareketin önceki bütün seanslarını geçtiğinde */
function prList(){
  var out=[];
  Object.keys(EX).forEach(function(id){
    var h=exHist(id),best=null;
    h.forEach(function(x){if(best!=null&&x.v>best+0.01)out.push({id:id,d:x.d,v:x.v,sets:x.sets,prev:best});if(best==null||x.v>best)best=x.v;});
  });
  out.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0;});
  return out;
}

/* ============ YOLCULUK ============ */
function journey(){
  var b0=startW(),g0=S.profile.goalWeight,tn=trendNow(),lw=lastWeight();
  if(b0==null||tn==null)return null;
  var r={b0:b0,g0:g0,tn:tn,lw:lw,lost:b0-tn,si:slopeInfo(21)};
  if(g0&&b0>g0){
    r.span=b0-g0;r.left=Math.max(0,tn-g0);r.pct=clamp((b0-tn)/(b0-g0),0,1);
    if(r.si&&r.si.slope<-0.05&&tn>g0){r.eta=addD(today(),Math.round((tn-g0)/(-r.si.slope)*7));}
    r.reached=tn<=g0;
  }
  return r;
}
/* hız yorumu (kg/hafta ve vücut ağırlığının yüzdesi) */
function paceNote(si,tn){
  if(!si)return null;
  var s=si.slope,pct=tn?(-s/tn*100):0;
  if(s>0.15)return {c:'amb',t:'Son 3 haftada trend hafif yukarı. Regl, tuz ya da yeni başlayan antrenman su tutabilir; 1–2 hafta daha izle. Devam ederse kaloriyi 100–150 düşür.'};
  if(s>-0.1)return {c:'blu',t:'Kilo şu an sabit. Bel ölçün azalıyorsa sorun yok. Değişmiyorsa kalori girişlerini kontrol et ya da günlük adımı 2.000 artır.'};
  if(pct>1.1)return {c:'amb',t:'Çok hızlı gidiyorsun (haftada '+fk1(-s)+' kg). Kas kaybetmemek için kaloriyi biraz artır, proteini aksatma.'};
  if(-s<0.3)return {c:'grn',t:'Yavaş ama düzenli iniyorsun (haftada '+fk1(-s)+' kg). Sabırla devam, bu tempo kalıcıdır.'};
  return {c:'grn',t:'Haftada '+fk1(-s)+' kg ile ideal aralıktasın (0,3–0,8 kg). Tam böyle devam!'};
}

function heroCard(d){

function setRow(d,id,r,sg,ns){
  var arr=setsOf(d,id),s=arr[r]||{},done=!!s.ok,extra=r>=ns,e=EX[id];
  if(e.opts){
    /* evde: kilo kutusu yerine seviye seçimi; önceki satırda seçilen seviye, yoksa öneri */
    var po=sg.o;for(var q=r-1;q>=0;q--){if(arr[q]&&arr[q].o!=null){po=+arr[q].o;break;}}
    var so=s.o!=null?+s.o:po;
    var sn0=extra?'<button class="sn del" data-a="delset" data-ex="'+id+'" data-i="'+r+'" aria-label="Seti sil">✕</button>':'<span class="sn">'+(r+1)+'</span>';
    return '<div class="srow lv'+(done?' done':'')+'">'+sn0+
      '<select class="sinp sel" data-k="o" data-ex="'+id+'" data-i="'+r+'" aria-label="seviye">'+e.opts.map(function(o,i){
        return '<option value="'+i+'"'+(i===so?' selected':'')+'>'+esc(o.s)+'</option>';}).join('')+'</select>'+
      '<span class="x">×</span>'+
      '<input class="sinp" inputmode="numeric" autocomplete="off" data-k="rep" data-ex="'+id+'" data-i="'+r+'" placeholder="'+sg.rep+'" value="'+esc(vstr(s.rep))+'" aria-label="tekrar">'+
      '<button class="sok" data-a="setok" data-ex="'+id+'" data-i="'+r+'" aria-label="'+(r+1)+'. set tamam">'+IC.check+'</button></div>';
  }
  /* kilo önerisi: bugün önceki sete yazılan kilo, yoksa uygulamanın önerisi */
  var phk=sg.kg;for(var j=r-1;j>=0;j--){if(arr[j]&&arr[j].kg!=null){phk=arr[j].kg;break;}}
  var sn=extra?'<button class="sn del" data-a="delset" data-ex="'+id+'" data-i="'+r+'" aria-label="Seti sil">✕</button>':'<span class="sn">'+(r+1)+'</span>';
  return '<div class="srow'+(done?' done':'')+'">'+sn+
    '<input class="sinp" inputmode="decimal" autocomplete="off" data-k="kg" data-ex="'+id+'" data-i="'+r+'" placeholder="'+(phk!=null?esc(vstr(phk)):'kg')+'" value="'+esc(vstr(s.kg))+'" aria-label="kilo">'+
    '<span class="x">kg<br>×</span>'+
    '<input class="sinp" inputmode="numeric" autocomplete="off" data-k="rep" data-ex="'+id+'" data-i="'+r+'" placeholder="'+sg.rep+'" value="'+esc(vstr(s.rep))+'" aria-label="tekrar">'+
    '<button class="sok" data-a="setok" data-ex="'+id+'" data-i="'+r+'" aria-label="'+(r+1)+'. set tamam">'+IC.check+'</button></div>';
}
function ensureWo(d){
  var x=DW(d);
  if(!x.wo)x.wo={type:woTypeFor(d),mode:modeFor(d),sets:{}};
  if(!x.wo.type)x.wo.type=woTypeFor(d);
  /* henüz set girilmediyse program (ev/salon) şu anki moda uyar */
  if(!woAny(x.wo))x.wo.mode=d<today()?(x.wo.mode||S.mode):S.mode;
  if(!x.wo.sets)x.wo.sets={};
  return x.wo;
}
function ensureSets(d,id){var w=ensureWo(d);if(!w.sets[id])w.sets[id]=[];return w.sets[id];}

/* ============ ANTRENMAN ÖZETİ ============ */
function summarySheet(d){
  var w=woOf(d);if(!w)return;
  var ty=w.type||woTypeFor(d),W=WOD(d,ty),nset=0,vol=0,rows='',ups=0,downs=0,prs=[],nex=0;
  W.ex.forEach(function(id){
    var e=EX[id],ss=okSets(setsOf(d,id));if(!ss.length)return;
    nex++;nset+=ss.length;
    ss.forEach(function(s){vol+=(+s.kg||0)*s.rep;});
    var nowv=sessVal(id,ss),pv=prevSess(id,d),best=0;
    exHist(id).forEach(function(x){if(x.d<d&&x.v>best)best=x.v;});
    var cmp='<span class="eq">ilk kez</span>';
    if(pv){
      var pct=(nowv/pv.v-1)*100;
      if(pct>1){ups++;cmp='<span class="up">↑ %'+fx(pct,0)+'</span>';}
      else if(pct<-3){downs++;cmp='<span class="dn">↓ %'+fx(-pct,0)+'</span>';}
      else cmp='<span class="eq">= aynı</span>';
      if(nowv>best+0.01)prs.push(e.n);
    }
    rows+='<div class="it"><div class="mf">'+figSVG(e.fig)+'</div><div class="tx"><b>'+esc(e.n)+'</b><span>'+esc(setsStr(id,ss))+'</span></div><div class="rt">'+cmp+'</div></div>';
  });
  var min=w.t0&&w.t1?Math.max(1,Math.round((w.t1-w.t0)/60000)):null;
  var msg;
  if(prs.length)msg='Bugün '+prs.length+' rekor: '+prs.join(', ')+'. Kilo verirken güçlenmek kasını koruduğunun en iyi işareti.';
  else if(ups>=2)msg=ups+' harekette geçen seferden güçlüsün. Kilo verirken güçlenmek kas koruduğunu gösterir.';
  else if(downs>=3)msg='Bugün zor geçti, olur. Uykuna ve proteinine bak; bir sonraki seans telafi edersin.';
  else msg='Güzel iş. Her seans bir öncekinin üstüne ekleniyor; devamlılık her şeyden önemli.';
  var h='<h2>Antrenman bitti</h2><div class="sub">'+W.name+' · '+fdateL(d)+'</div>'+
    '<div class="stat mt14"><div><b>'+nex+'/'+W.ex.length+'</b><span>hareket</span></div><div><b>'+nset+'</b><span>set</span></div>'+
    '<div><b>'+(min?min+' dk':'—')+'</b><span>süre</span></div><div><b>'+fx(vol)+'</b><span>kg toplam kaldırdın</span></div></div>'+
    '<div class="note grn mt14">'+esc(msg)+'</div>'+
    (rows?'<div class="eyebrow mt14">Geçen seansa göre</div><div class="lst">'+rows+'</div>':'')+
    '<div class="hint mt10">Sırada: proteinini tamamla, adım hedefine bak.</div>'+
    '<button class="btn wide big mt14" data-a="shclose">Tamam</button>';
  openSheet(h);
}

/* ============ DİNLENME SAYACI ============ */
var RT={end:0,total:0,label:'',iv:null,hideT:null};
function restStart(sec,label){
  RT.end=Date.now()+sec*1000;RT.total=sec;RT.label=label;clearTimeout(RT.hideT);
  var el=document.getElementById('restbar');
  el.className='on';
  el.innerHTML='<div class="rbt"><small id="rb-l"></small><div class="rbv" id="rb-v"></div></div>'+
    '<button data-a="restplus">+15 sn</button><button data-a="restskip">Geç</button><div class="rbp" id="rb-p"></div>';
  restTick();clearInterval(RT.iv);RT.iv=setInterval(restTick,250);
  pushSchedule(sec,label);
}
function restTick(){
  if(!RT.end)return;
  var left=(RT.end-Date.now())/1000,el=document.getElementById('restbar');
  if(left<=0){
    clearInterval(RT.iv);RT.iv=null;RT.end=0;
    el.className='on end';
    el.innerHTML='<div class="rbt"><small>Dinlenme bitti</small><div class="rbv">Sıradaki set</div></div><button data-a="restclose">Tamam</button>';
    try{if(navigator.vibrate)navigator.vibrate([180,80,180]);}catch(e){}
    RT.hideT=setTimeout(function(){el.className='';},7000);
    return;
  }
  var v=document.getElementById('rb-v'),l=document.getElementById('rb-l'),p=document.getElementById('rb-p');
  if(v)v.textContent=mmss(Math.ceil(left));
  if(l)l.textContent=RT.label;
  if(p)p.style.width=clamp((1-left/RT.total)*100,0,100)+'%';
}
function restStop(){
  clearInterval(RT.iv);RT.iv=null;var was=RT.end;RT.end=0;clearTimeout(RT.hideT);
  document.getElementById('restbar').className='';
  if(was)pushCancel();
}

  var j=journey();

  if(!j)return h+'<div class="hint">İlk tartını Bugün sekmesine gir; yolculuğun burada başlar.</div></div>';
  if(j.g0&&j.b0>j.g0){
    h+='<div class="big3"><div class="g"><b>'+(j.lost>0.05?'−'+fk1(j.lost):'0')+'</b><span>kg verdin</span></div>'+
       '<div><b>'+fk1(j.left)+'</b><span>kg kaldı</span></div><div><b>%'+fx(j.pct*100)+'</b><span>yol bitti</span></div></div>';
    h+='<div class="track">'+journeyTrack(j)+'</div>';
    h+='<div class="hint">Başlangıç <b>'+fk(j.b0)+' kg</b> · şimdi <b>'+fk1(j.tn)+' kg</b> (trend) · hedef <b>'+fk(j.g0)+' kg</b></div>';
    if(j.reached)h+='<div class="note grn mt10"><b>Hedefine ulaştın.</b> Yeni bir hedef koymak istersen Ayarlar\'dan değiştir.</div>';

  }else{
    h+='<div class="big3"><div><b>'+fk(j.b0)+'</b><span>başlangıç</span></div><div><b>'+fk1(j.tn)+'</b><span>şimdi (trend)</span></div>'+
       '<div class="g"><b>'+sign(-j.lost,1)+'</b><span>kg değişim</span></div></div>'+

function journeyTrack(j){
  var W=340,H=58,PL=12,PR=24,Y=24,len=W-PL-PR;
  function X(kg){return PL+(j.b0-kg)/(j.b0-j.g0)*len;}
  var xn=X(clamp(j.tn,j.g0,j.b0)),g='';
  g+='<line x1="'+PL+'" y1="'+Y+'" x2="'+(W-PR)+'" y2="'+Y+'" stroke="#efe3dc" stroke-width="7" stroke-linecap="round"/>';
  if(xn>PL+0.5)g+='<line x1="'+PL+'" y1="'+Y+'" x2="'+xn.toFixed(1)+'" y2="'+Y+'" stroke="#6d90bb" stroke-width="7" stroke-linecap="round"/>';
  var span=j.b0-j.g0,stp=span>16?2:1,top=Math.floor(j.b0);
  for(var k=top;k>j.g0;k--){
    if(k>=j.b0||(top-k)%stp)continue;
    var x=X(k),done=j.tn<=k;
    g+='<circle cx="'+x.toFixed(1)+'" cy="'+Y+'" r="2.6" fill="'+(done?'#fff':'#fffdfb')+'" stroke="'+(done?'#fff':'#cdbfc5')+'" stroke-width="1.3"/>'+
       '<text x="'+x.toFixed(1)+'" y="'+(Y+22)+'" text-anchor="middle" font-family="Karla,sans-serif" font-size="10" font-weight="700" fill="'+(done?'#857680':'#cdbfc5')+'">'+k+'</text>';
  }
  var xg=W-PR;
  g+='<path d="M'+(xg+3)+' '+(Y+5)+'V'+(Y-15)+'l9 3.5-9 3.5" fill="#5a9677" stroke="#5a9677" stroke-width="1.6" stroke-linejoin="round"/>';
  g+='<circle cx="'+xn.toFixed(1)+'" cy="'+Y+'" r="8" fill="#6d90bb" opacity=".2"/><circle cx="'+xn.toFixed(1)+'" cy="'+Y+'" r="5" fill="#6d90bb" stroke="#fffdfb" stroke-width="2"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+fk(j.b0)+' kg\'dan '+fk(j.g0)+' kg\'a, şu an '+fk1(j.tn)+' kg">'+g+'</svg>';
}

function niceStep(r){var s=[0.5,1,2,5,10];for(var i=0;i<s.length;i++)if(r/s[i]<=5)return s[i];return 10;}
function weightChart(range){
  var ws=weightSeries(),tr=trendSeries(),end=today();
  var from=range?addD(end,-(range-1)):ws[0].d;
  if(from<ws[0].d)from=ws[0].d;
  var pts=ws.filter(function(p){return p.d>=from;}),tp=tr.filter(function(p){return p.d>=from;});
  if(pts.length<2){pts=ws.slice(-2);tp=tr.slice(-2);from=pts[0].d;}
  var span=Math.max(1,dayDiff(from,end));
  var W=340,H=190,L=34,R=12,T=16,B=26,iw=W-L-R,ih=H-T-B;
  var vals=pts.map(function(p){return p.v;}).concat(tp.map(function(p){return p.v;}));
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),goal=S.profile.goalWeight;
  var showGoal=!!(goal&&goal>=mn-3&&goal<=mx+1);
  if(showGoal){mn=Math.min(mn,goal);mx=Math.max(mx,goal);}
  if(mx-mn<1.5){var c=(mx+mn)/2;mn=c-0.75;mx=c+0.75;}
  var pad=(mx-mn)*0.08;mn-=pad;mx+=pad;
  function X(d){return L+dayDiff(from,d)/span*iw;}
  function Y(v){return T+(mx-v)/(mx-mn)*ih;}
  var g='',i;
  if(S.cycle){var bw=Math.max(2,iw/span);
    for(i=0;i<=span;i++){var dd=addD(from,i);if(dv(dd,'period'))g+='<rect x="'+(X(dd)-bw/2).toFixed(1)+'" y="'+T+'" width="'+bw.toFixed(1)+'" height="'+ih+'" fill="#f9e3dc"/>';}}
  var st=niceStep(mx-mn),y0=Math.ceil(mn/st)*st;
  for(var v=y0;v<=mx+1e-9;v+=st){var yy=Y(v).toFixed(1);
    g+='<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="#f1e6e0" stroke-width="1"/>'+
       '<text x="'+(L-6)+'" y="'+(+yy+3.5)+'" text-anchor="end" font-size="10" font-weight="700" fill="#ab9ca3" font-family="Karla,sans-serif">'+fx(v,st<1?1:0)+'</text>';}
  if(showGoal){var gy=Y(goal).toFixed(1);
    g+='<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="#5a9677" stroke-width="1.6" stroke-dasharray="5 4"/>'+
       '<text x="'+(W-R)+'" y="'+(gy-5)+'" text-anchor="end" font-size="10" font-weight="800" fill="#3f7559" font-family="Karla,sans-serif">hedef '+fk(goal)+'</text>';}
  pts.forEach(function(p){g+='<circle cx="'+X(p.d).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="2.8" fill="'+(dv(p.d,'period')?'#e8a596':'#cdbfc5')+'"/>';});
  g+='<path d="'+tp.map(function(p,k){return (k?'L':'M')+X(p.d).toFixed(1)+','+Y(p.v).toFixed(1);}).join('')+'" fill="none" stroke="#6d90bb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>';
  var lt=tp[tp.length-1],lx=X(lt.d),ly=Y(lt.v);
  g+='<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="4.5" fill="#6d90bb" stroke="#fffdfb" stroke-width="2"/>'+
     '<text x="'+Math.min(W-R,lx).toFixed(1)+'" y="'+(ly-9).toFixed(1)+'" text-anchor="end" font-size="11" font-weight="800" fill="#41668f" font-family="Karla,sans-serif">'+fk1(lt.v)+'</text>';
  [from,addD(from,Math.round(span/2)),end].forEach(function(d,k){
    g+='<text x="'+X(d).toFixed(1)+'" y="'+(H-7)+'" text-anchor="'+(k===0?'start':k===2?'end':'middle')+'" font-size="10" font-weight="700" fill="#ab9ca3" font-family="Karla,sans-serif">'+fdate(d)+'</text>';});
  g+='<line id="chl" x1="0" y1="'+T+'" x2="0" y2="'+(T+ih)+'" stroke="#3b3236" stroke-width="1" opacity="0"/><circle id="chm" cx="0" cy="0" r="5" fill="#3b3236" stroke="#fff" stroke-width="2" opacity="0"/>';
  var tmap={};tr.forEach(function(p){tmap[p.d]=p.v;});
  CH={W:W,goal:showGoal,pts:pts.map(function(p){return {x:X(p.d),y:Y(p.v),d:p.d,v:p.v,t:tmap[p.d]};})};
  return '<svg viewBox="0 0 '+W+' '+H+'" id="wsvg">'+g+'</svg>';
}

/* bu haftanın spor günlerine A/B etiketi: sıradaki antrenmandan başlayarak */
function planSeq(){
  var t=today(),ms=monday(t),out={},ty=null;
  var days=[];for(var i=0;i<7;i++)days.push(addD(ms,i));
  days.forEach(function(d){
    if(!isGymDay(d)&&!woAny(woOf(d)))return;
    if(d<t&&woAny(woOf(d))){out[dow(d)]=woOf(d).type;ty=woOf(d).type;return;}
    if(d<t){return;}
    var x=ty?(ty==='A'?'B':'A'):woTypeFor(d);
    if(woOf(d)&&woOf(d).type)x=woOf(d).type;
    out[dow(d)]=x;ty=x;
  });
  return out;
}

}
function tf(k,label,unit,v,sug){
  return '<div class="fld"><label>'+label+'<i>'+(unit||'')+'</i></label><input class="inp sm" data-tg="'+k+'" inputmode="'+(k==='sleep'?'decimal':'numeric')+'" autocomplete="off" placeholder="—" value="'+esc(vstr(v))+'">'+
    (sug!=null?'<div class="fh" id="sg-'+k+'">'+sug+'</div>':'')+'</div>';

function kcalSugText(){
  var t=S.targets,s=suggestKcal(S.maint);

  return 'öneri: '+fx(s)+' · <span data-a="kcalauto" style="color:var(--acc2);font-weight:800">öneriye dön</span>';
}
function protSugText(){
  var t=S.targets,s=suggestProtein();

  return 'öneri: '+fx(s)+' g · <span data-a="protauto" style="color:var(--acc2);font-weight:800">öneriye dön</span>';
}

function calcLive(){
  var m=calcMaint(CALC.w,CALC.h,CALC.a,CALC.f);

  if(r)r.textContent=m?fx(m)+' kcal':'—';
  if(hn)hn.textContent=m?'kalori hedefin: '+fx(suggestKcal(m))+' kcal':'yaş, boy ve kilo gir';
  if(b){if(m)b.removeAttribute('disabled');else b.setAttribute('disabled','');}

function setMaint(v,src){
  S.maint=v||null;S.maintSrc=v?src:'';
  autoTargets();touchSettings();
}

function payload(){
  return {app:'form-kardes',v:1,profile:S.profile,maint:S.maint,maintSrc:S.maintSrc,targets:S.targets,
    gymDays:S.gymDays,mode:S.mode,modeStart:S.modeStart,cycle:S.cycle,days:S.days,_st:S._st,created:S.created||0};
}
/* gün gün birleştir: iki tarafta da en yeni kayıt kazanır; ayarlar _st'si yeni olandan gelir */
function mergeIn(rm){
  var ch=0;
  Object.keys(rm.days||{}).forEach(function(d){
    if(!isValidDs(d))return;
    var r=rm.days[d],l=S.days[d];
    if(r&&(!l||(r._t||0)>(l._t||0))){S.days[d]=r;ch++;}
  });
  if((rm._st||0)>(S._st||0)){
    ['profile','maint','maintSrc','targets','gymDays','mode','modeStart','cycle','created'].forEach(function(k){if(rm[k]!==undefined)S[k]=rm[k];});
    S._st=rm._st;ch++;normalize();
  }
  return ch;
}
function exportBackup(){
  var data=JSON.stringify({app:'form-kardes',v:1,exported:new Date().toISOString(),data:payload()});
  var name='form-yedek-'+today()+'.json',blob=new Blob([data],{type:'application/json'});
  function done(m){DEV.lastBackup=Date.now();saveDev();toast(m);if(TAB==='bugun'||TAB==='ayarlar')rerenderKeep();}
  function dl(){
    var u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(u);a.remove();},2000);
    done('Yedek indirildi');
  }
  try{
    var file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'FORM yedeği'}).then(function(){done('Yedek kaydedildi');})
        .catch(function(e){if(!(e&&e.name==='AbortError'))dl();});
      return;
    }
  }catch(e){}
  dl();
}
function importBackup(file){
  var fr=new FileReader();
  fr.onload=function(){
    var o=null;try{o=JSON.parse(fr.result);}catch(e){}
    var d=o&&(o.data||o);
    if(!d||d.app!=='form-kardes'||!d.days){toast('Bu dosya bu uygulamanın yedeği değil');return;}
    var n=mergeIn(d);
    saveNow();render();
    toast(n?'Yedek yüklendi ('+n+' kayıt)':'Yedekteki her şey zaten burada',2400);
  };
  fr.onerror=function(){toast('Dosya okunamadı');};
  fr.readAsText(file);
}

/* ============ BULUT YEDEĞİ (GitHub Gist) ============
   Ağabeyin FORM'undaki yöntem: veriler GitHub'da gizli bir Gist dosyasında durur.
   Anahtar yalnız bu telefonda saklanır; buluta ve yedek dosyasına gönderilmez. */
var GFILE='form-kardes.json',syncing=false,pushT=null,syncMsg='';
function syncOn(){return !!(S&&S.sync&&S.sync.token&&S.sync.gist);}
function gh(path,opts){
  opts=opts||{};var url='https://api.github.com'+path;
  if((opts.method||'GET')==='GET')url+=(url.indexOf('?')<0?'?':'&')+'_='+Date.now();
  return fetch(url,{method:opts.method||'GET',cache:'no-store',
    headers:{'Authorization':'Bearer '+S.sync.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:opts.body?JSON.stringify(opts.body):undefined
  }).then(function(r){
    if(r.status===401)throw new Error('anahtar geçersiz ya da süresi dolmuş');
    if(r.status===404)throw new Error('gist bulunamadı');
    if(r.status===403||r.status===429)throw new Error('GitHub izin vermedi (anahtarın "gist" yetkisi yok ya da istek sınırı doldu)');
    if(!r.ok)throw new Error('GitHub '+r.status);
    return r.json();
  });
}
function setSyncMsg(m){syncMsg=m;var el=document.getElementById('saved');if(el&&!el.classList.contains('flash'))el.textContent=badgeText();}
function syncNow(silent){
  if(syncing||!syncOn())return Promise.resolve();
  syncing=true;setSyncMsg('eşitleniyor…');
  return gh('/gists/'+S.sync.gist).then(function(g){
    var f=g.files&&g.files[GFILE];
    if(!f)return null;
    if(f.truncated)return fetch(f.raw_url).then(function(r){return r.text();});
    return f.content;
  }).then(function(txt){
    var n=0;
    if(txt){
      var rm=null;try{rm=JSON.parse(txt);}catch(e){}
      /* bulutta veri var ama okunamıyorsa üzerine YAZMA: bozuk bir indirme bütün yedeği silebilir */
      if(rm==null)throw new Error('buluttaki veri okunamadı, üzerine yazılmadı');
      n=mergeIn(rm);
    }
    var body={files:{}};body.files[GFILE]={content:JSON.stringify(payload())};
    return gh('/gists/'+S.sync.gist,{method:'PATCH',body:body}).then(function(){return n;});
  }).then(function(n){
    S.sync.last=Date.now();syncing=false;
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    setSyncMsg('');
    if(!silent)toast(n?n+' kayıt buluttan geldi':'Bulut güncel');
    if(n){if(typing)pendingRender=true;else rerenderKeep();}
  }).catch(function(e){
    syncing=false;setSyncMsg(silent?'bulut hatası':'');
    if(!silent)toast('Bulut: '+e.message,3000);
  });
}
function schedulePush(){clearTimeout(pushT);pushT=setTimeout(function(){syncNow(true);},3000);}
function connectSync(tok){
  tok=(tok||'').trim();if(!tok){toast('Anahtarı yapıştır');return;}
  S.sync.token=tok;setSyncMsg('bağlanıyor…');
  var body={description:'FORM (kişisel) — antrenman ve beslenme kayıtları',public:false,files:{}};
  body.files[GFILE]={content:JSON.stringify(payload())};
  gh('/gists',{method:'POST',body:body}).then(function(g){
    S.sync.gist=g.id;S.sync.last=Date.now();saveNow();setSyncMsg('');toast('Bulut yedeği açıldı');render();
  }).catch(function(e){S.sync.token='';setSyncMsg('');toast('Bağlanamadı: '+e.message,3200);});
}
function makeCode(){try{return 'FK1-'+btoa(unescape(encodeURIComponent(S.sync.token+'|'+S.sync.gist)));}catch(e){return '';}}
function readCode(c){
  c=(c||'').trim();if(c.indexOf('FK1-')!==0)return null;
  try{var a=decodeURIComponent(escape(atob(c.slice(4)))).split('|');return a.length===2&&a[0]&&a[1]?{token:a[0],gist:a[1]}:null;}catch(e){return null;}
}
function useCode(c){
  var r=readCode(c);if(!r){toast('Kod hatalı: FK1- ile başlamalı');return;}
  S.sync.token=r.token;S.sync.gist=r.gist;S.sync.last=0;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  closeSheet();
  syncNow(false).then(function(){render();});
}

  }
  return h+'</div>';
}

/* ============ DİNLENME BİLDİRİMİ (push) ============
   iPhone ekranı kilitlenince sayfa donar, sayaç sesi çalamaz. Ağabeyin FORM'u için
   kurulmuş bildirim sunucusu kullanılır: dinlenme başlayınca "N sn sonra haber ver"
   denir, süre dolunca telefona gerçek bildirim gelir. Yalnız ana ekrana eklenmiş
   uygulamada çalışır (iOS 16.4+). Abonelik bu cihaza özeldir, buluta gitmez. */
var pushMsg='';
function pushSub(){return DEV.push||null;}
function pushCan(){return ('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);}
function pushPost(path,body){
  return fetch(PUSHURL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),keepalive:true})
    .then(function(r){return r.json();}).catch(function(){return null;});
}
function pushSchedule(sec,label){
  var sb=pushSub();if(!sb)return;
  pushPost('/schedule',{sub:sb,delay:Math.max(1,Math.round(sec)),title:'Dinlenme bitti',body:(label||'')+' — sıradaki set'});
}
function pushCancel(){var sb=pushSub();if(sb)pushPost('/cancel',{sub:sb});}
function b64uBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function pushEnable(){
  if(!pushCan()){pushMsg='Bu ekranda bildirim desteklenmiyor.';return Promise.resolve(false);}
  var key=null;
  /* iOS izni yalnız düğmeye dokunuşun içinde sorar: ilk çağrı bu olmalı */
  return Notification.requestPermission().then(function(p){
    if(p!=='granted')throw new Error('Bildirim izni verilmedi. iPhone Ayarlar → Bildirimler → FORM\'dan açabilirsin.');
    return fetch(PUSHURL+'/vapid').then(function(r){return r.json();});
  }).then(function(k){
    key=b64uBytes(k.key);
    return navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;});
  }).then(function(reg){
    return reg.pushManager.getSubscription().then(function(old){
      var same=false;
      try{var ok=old&&old.options&&old.options.applicationServerKey;if(ok){var a=new Uint8Array(ok);same=a.length===key.length&&a.every(function(x,i){return x===key[i];});}}catch(e){}
      if(old&&same)return old;
      return (old?old.unsubscribe():Promise.resolve()).then(function(){return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});});
    });
  }).then(function(sub){
    DEV.push=sub.toJSON();saveDev();pushMsg='Açık ✓ Dinlenme bitince telefon bildirim gönderecek.';return true;
  }).catch(function(e){pushMsg=(e&&e.message)||'Açılamadı';return false;});
}
function pushDisable(){
  pushCancel();DEV.push=null;saveDev();pushMsg='Kapatıldı.';
  if(pushCan())navigator.serviceWorker.getRegistration().then(function(reg){if(reg)reg.pushManager.getSubscription().then(function(s){if(s)s.unsubscribe();});}).catch(function(){});
}
function pushTest(){
  var sb=pushSub();if(!sb)return;
  pushPost('/schedule',{sub:sb,delay:8,title:'Test bildirimi',body:'Bildirimler çalışıyor. Dinlenme bitince böyle haber gelecek.'}).then(function(r){
    toast(r&&r.ok?'8 sn içinde bildirim gelecek; ekranı kilitleyebilirsin':'Sunucuya ulaşılamadı',2600);});
}
/* başka telefondan taşınmış abonelik kaydını temizle */
function pushVerify(){
  if(!pushCan())return;
  navigator.serviceWorker.getRegistration().then(function(reg){return reg?reg.pushManager.getSubscription():null;}).then(function(real){
    var st=pushSub();
    if(st&&(!real||real.endpoint!==st.endpoint)){DEV.push=null;saveDev();}
    else if(!st&&real&&Notification.permission==='granted'){DEV.push=real.toJSON();saveDev();}
  }).catch(function(){});
}
function pushCard(){
  var st,btns='';
  if(!pushCan())st=standalone()?'Bu telefonda bildirim desteklenmiyor (iOS 16.4 ve üstü gerekir).':'Bildirim yalnız ana ekrana eklenmiş uygulamada çalışır. Safari\'de Paylaş → Ana Ekrana Ekle, sonra uygulamayı simgeden aç.';
  else if(pushSub()){st='Açık ✓ Sayaç bitince ekran kilitliyken de bildirim gelir.';btns='<button class="btn sm ghost" data-a="pushtest">Test et</button><button class="btn sm ghost" data-a="pushoff">Kapat</button>';}
  else{st='Kapalı. Açarsan dinlenme bitince telefon bildirim gönderir; ekran kilitli ya da müzik açık olsa da duyarsın.';btns='<button class="btn sm" data-a="pushon">Bildirimi aç</button>';}
  return '<div class="card"><div class="ch"><h2>Dinlenme bildirimi</h2></div><div class="hint">'+esc(pushMsg||st)+'</div>'+(btns?'<div class="row wrapf gap6 mt10">'+btns+'</div>':'')+'</div>';
}
