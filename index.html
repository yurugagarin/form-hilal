  var best=0,had=false;exHist(id).forEach(function(x){if(x.d<d){had=true;if(x.v>best)best=x.v;}});
  var before=sessVal(id,arr)||0;
  s.kg=kg;s.rep=rep;s.ok=1;s.at=Date.now();if(lv!=null)s.o=lv;else delete s.o;
  var w=ensureWo(d);if(!w.t0)w.t0=Date.now();
  save();
  var nowv=sessVal(id,arr)||0,isPR=had&&nowv>best+0.01&&before<=best+0.01;
  var done=okSets(arr).length,ns=setsFor(d),ids=WOD(d,w.type).ex,pos=ids.indexOf(id),p=woProg(d);
  if(isPR)toast('Yeni rekor: '+e.n+' 🎉',2600);
  if(done<ns)restStart(e.rest,e.n+' · '+(done+1)+'. set');
  else if(p.n>=p.total){restStop();if(!isPR)toast('Bütün hareketler tamam. "Antrenmanı bitir"e bas.',2800);}
  else{
    var nx=null;for(var j=pos+1;j<ids.length;j++)if(!exDone(d,ids[j])){nx=ids[j];break;}
    if(nx)restStart(e.rest,'Sıradaki: '+EX[nx].n);
    if(!isPR)toast(e.n+' tamam ✓');
  }
  rerenderKeep();
};
DO.addset=function(el){var id=el.getAttribute('data-ex'),arr=ensureSets(cur,id),ns=setsFor(cur);while(arr.length<ns)arr.push({});arr.push({});save();rerenderKeep();};
DO.delset=function(el){var id=el.getAttribute('data-ex'),i=+el.getAttribute('data-i'),arr=ensureSets(cur,id);if(i<arr.length)arr.splice(i,1);DW(cur);save();rerenderKeep();};
DO.figbig=function(el){exSheet(el.getAttribute('data-ex'));};
DO.finish=function(){var w=ensureWo(cur);w.done=1;w.t1=Date.now();if(!w.t0)w.t0=w.t1;DW(cur);saveNow();restStop();render();window.scrollTo(0,0);summarySheet(cur);};
DO.summary=function(){summarySheet(cur);};
DO.shclose=function(){closeSheet();};
DO.restplus=function(){if(!RT.end)return;RT.end+=15000;RT.total+=15;restTick();pushSchedule((RT.end-Date.now())/1000,RT.label);};
DO.restskip=function(){restStop();};
DO.restclose=function(){clearTimeout(RT.hideT);document.getElementById('restbar').className='';};
DO.rng=function(el){progRange=+el.getAttribute('data-n');rerenderKeep();};
DO.calm=function(el){var n=+el.getAttribute('data-n'),y=+calM.slice(0,4),m=+calM.slice(5,7)+n;if(m<1){m=12;y--;}if(m>12){m=1;y++;}calM=y+'-'+pad2(m);rerenderKeep();};
DO.usereal=function(el){setMaint(+el.getAttribute('data-n'),'data');rerenderKeep();toast('Bakım kalorisi güncellendi');};
DO.calc=function(){calcSheet();};
DO.calcf=function(el){CALC.f=+el.getAttribute('data-n');document.querySelectorAll('[data-a="calcf"]').forEach(function(b){b.classList.toggle('on',+b.getAttribute('data-n')===CALC.f);});calcLive();};
DO.calcuse=function(){var m=calcMaint(CALC.w,CALC.h,CALC.a,CALC.f);if(!m)return;
  if(CALC.h&&!S.profile.height)S.profile.height=CALC.h;if(CALC.a&&!S.profile.age)S.profile.age=CALC.a;
  setMaint(m,'calc');closeSheet();rerenderKeep();toast('Bakım kalorisi: '+fx(m)+' kcal');};
DO.kcalauto=function(){S.targets.kcalAuto=true;autoTargets();touchSettings();rerenderKeep();};
DO.protauto=function(){S.targets.protAuto=true;autoTargets();touchSettings();rerenderKeep();};
DO.gymday=function(el){var g=+el.getAttribute('data-n'),i=S.gymDays.indexOf(g);
  if(i>=0){if(S.gymDays.length<=1){toast('En az bir gün seç');return;}S.gymDays.splice(i,1);}else S.gymDays.push(g);
  S.gymDays.sort();touchSettings();rerenderKeep();};
/* ev ⇄ salon. Geçmiş antrenmanlar kendi programında kalır; yeni programın öğrenme dönemi
   ilk geçişte başlar; güç endeksi ve öneriler yeni programın hareketlerinden hesaplanır. */
DO.pview=function(el){progView=el.getAttribute('data-m');if(progView===S.mode)progView=null;rerenderKeep();};
DO.mode=function(el){
  var m=el.getAttribute('data-m');if(m!=='ev'&&m!=='salon'||m===S.mode)return;
  var first=!S.modeStart[m];
  var msg=m==='salon'
    ?'Salon programına geçiliyor.\n\n'+(first?'Salon hareketleri için 2 haftalık öğrenme dönemi başlar (hareket başına 2 set). ':'')+'Güç endeksi ve kilo önerileri salon hareketlerine göre hesaplanır. Ev kayıtların silinmez.'
    :'Ev programına dönülüyor.\n\nGüç endeksi ve öneriler ev hareketlerine göre hesaplanır. Salon kayıtların silinmez.';
  if(!confirm(msg))return;
  S.mode=m;if(first)S.modeStart[m]=today();
  var w=woOf(today());if(w&&!woAny(w)){w.mode=m;DW(today());}
  exIdx=0;progView=null;touchSettings();rerenderKeep();
  toast(m==='salon'?'Salon programı açık':'Ev programı açık');
};
DO.cycle=function(){S.cycle=!S.cycle;touchSettings();rerenderKeep();};
DO.reload=function(){location.reload();};
DO.wipe=function(){
  if(!confirm('Bütün kayıtların bu telefondan silinecek. Emin misin?'))return;
  if(!confirm('Geri dönüşü yok. Önce yedek almak istersen İptal\'e bas.'))return;
  try{localStorage.removeItem(KEY);}catch(e){}
  S=clone(DEF);normalize();TAB='bugun';cur=today();render();window.scrollTo(0,0);
};
DO.syncnow=function(){syncNow(false);};
DO.connect=function(){var i=document.getElementById('tokinp');connectSync(i?i.value:'');};
DO.sucode=function(){codeSheet();};
DO.usecode=function(){var i=document.getElementById('codeinp');useCode(i?i.value:'');};
DO.copycode=function(){var c=makeCode();
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(function(){toast('Kod kopyalandı');},function(){toast('Kopyalanamadı; kutudan seçip kopyala');});
  else toast('Kutudan seçip kopyala');};
DO.syncoff=function(){if(!confirm('Bulut bağlantısı kesilsin mi? Buluttaki dosya silinmez, bu telefon artık eşitlenmez.'))return;S.sync={token:'',gist:'',last:0};saveNow();rerenderKeep();};
DO.pushon=function(el){el.setAttribute('disabled','');pushEnable().then(function(){rerenderKeep();});};
DO.pushoff=function(){pushDisable();rerenderKeep();};
DO.pushtest=function(){pushTest();};
/* kurulum */
DO.sumode=function(el){SU.mode=el.getAttribute('data-m');document.querySelectorAll('[data-a="sumode"]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-m')===SU.mode);});};
DO.sugym=function(el){var g=+el.getAttribute('data-n'),i=SU.days.indexOf(g);if(i>=0)SU.days.splice(i,1);else SU.days.push(g);el.classList.toggle('on',SU.days.indexOf(g)>=0);};
DO.suf=function(el){SU.f=+el.getAttribute('data-n');document.querySelectorAll('[data-a="suf"]').forEach(function(b){b.classList.toggle('on',+b.getAttribute('data-n')===SU.f);});
  var h=document.getElementById('suhint');if(h)h.innerHTML=suHint();};
DO.sucalc=function(){
  var m=calcMaint(SU.w,SU.height,SU.age,SU.f);
  if(!m){toast('Önce yaş, boy ve kilonu yaz');return;}
  SU.maint=m;SU.calc=true;var i=document.querySelector('[data-su="maint"]');if(i)i.value=String(m);
  var h=document.getElementById('suhint');if(h)h.innerHTML=suHint();
};
DO.sugo=function(){
  if(!SU.days.length){toast('En az bir spor günü seç');return;}
  if(SU.w!=null&&(SU.w<30||SU.w>250)){toast('Kiloyu kontrol et');return;}
  if(SU.goal!=null&&SU.w!=null&&SU.goal>=SU.w){toast('Hedef kilo şu anki kilondan düşük olmalı');return;}
  var p=S.profile;
  p.name=(SU.name||'').trim().slice(0,24);p.age=SU.age||null;p.height=SU.height||null;
  p.startWeight=SU.w||null;p.goalWeight=SU.goal||null;p.startDate=today();
  S.gymDays=SU.days.slice().sort();
  S.mode=SU.mode||'ev';S.modeStart={};S.modeStart[S.mode]=today();
  var m=SU.maint,src=SU.calc?'calc':'manual';
  if(!m&&SU.w&&SU.height&&SU.age){m=calcMaint(SU.w,SU.height,SU.age,SU.f);src='calc';}
  S.maint=m||null;S.maintSrc=m?src:'';
  if(SU.w)DW(today()).w=SU.w;
  S.targets.kcalAuto=true;S.targets.protAuto=true;autoTargets();
  S.created=Date.now();S._st=Date.now();saveNow();
  TAB='bugun';cur=today();render();window.scrollTo(0,0);welcomeSheet();
};

/* ============ GİRDİLER ============ */
function onDay(t){
  var k=t.getAttribute('data-f'),v;
  if(k==='note')v=t.value.trim()?t.value.slice(0,1000):null;
  else if(k==='w'||k==='sleep'||k==='waist'||k==='hip')v=num(t.value);
  else v=int(t.value);
  if(k==='sleep'&&v!=null&&v>24)v=24;
  var x=DW(cur);if(v==null)delete x[k];else x[k]=v;
  save();liveToday(k);
}
function onSet(t){
  var k=t.getAttribute('data-k'),id=t.getAttribute('data-ex'),i=+t.getAttribute('data-i');
  if(!EX[id])return;
  var arr=ensureSets(cur,id);while(arr.length<=i)arr.push({});
  if(k==='o'){
    var lv=+t.value;arr[i].o=lv;arr[i].kg=EX[id].opts[lv].kg;save();
    document.querySelectorAll('select[data-k="o"][data-ex="'+id+'"]').forEach(function(sel){
      var j=+sel.getAttribute('data-i');if(j>i&&!(arr[j]&&arr[j].o!=null))sel.value=String(lv);});
    return;
  }
  var v=k==='kg'?num(t.value):int(t.value);
  if(v==null)delete arr[i][k];else arr[i][k]=v;
  if(arr[i].ok&&(arr[i].kg==null||!arr[i].rep))arr[i].ok=0;
  save();
  if(k==='kg')document.querySelectorAll('input[data-k="kg"][data-ex="'+id+'"]').forEach(function(inp){
    var j=+inp.getAttribute('data-i');if(j>i&&!inp.value&&v!=null)inp.placeholder=vstr(v);});
}
function onProfile(t){
  var k=t.getAttribute('data-p'),v;
  if(k==='name')v=t.value.slice(0,24);
  else if(k==='startDate'){if(!isValidDs(t.value)||t.value>today())return;v=t.value;}
  else if(k==='startWeight'||k==='goalWeight')v=num(t.value);
  else v=int(t.value);
  S.profile[k]=v;
  if(k==='goalWeight'||k==='startWeight')autoTargets();
  touchSettings();pendingRender=true;
}
function onTarget(t){
  var k=t.getAttribute('data-tg'),v=k==='sleep'?num(t.value):int(t.value);
  S.targets[k]=v;
  if(k==='kcal')S.targets.kcalAuto=false;
  if(k==='protein')S.targets.protAuto=false;
  touchSettings();pendingRender=true;
}
function onMaint(t){
  setMaint(int(t.value),'manual');
  var ki=document.querySelector('[data-tg="kcal"]');if(ki&&S.targets.kcalAuto)ki.value=vstr(S.targets.kcal);
  var sg=document.getElementById('sg-kcal');if(sg)sg.innerHTML=kcalSugText();
  pendingRender=true;
}
function onCalc(t){var k=t.getAttribute('data-c');CALC[k]=k==='w'?num(t.value):int(t.value);calcLive();}
function onSetup(t){
  var k=t.getAttribute('data-su');
  if(k==='name')SU.name=t.value;
  else if(k==='w'||k==='goal')SU[k]=num(t.value);
  else SU[k]=int(t.value);
  if(k==='maint')SU.calc=false;
  var h=document.getElementById('suhint');if(h)h.innerHTML=suHint();
}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;
  var fn=DO[el.getAttribute('data-a')];if(fn)fn(el,ev);
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.hasAttribute('data-f'))onDay(t);
  else if(t.hasAttribute('data-k'))onSet(t);
  else if(t.hasAttribute('data-p')&&t.type!=='date')onProfile(t);
  else if(t.hasAttribute('data-tg'))onTarget(t);
  else if(t.hasAttribute('data-m'))onMaint(t);
  else if(t.hasAttribute('data-c'))onCalc(t);
  else if(t.hasAttribute('data-su'))onSetup(t);
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.hasAttribute('data-imp')&&t.files&&t.files[0]){importBackup(t.files[0]);t.value='';}
  else if(t.getAttribute('data-p')==='startDate'){onProfile(t);rerenderKeep();}
  else if(t.getAttribute('data-k')==='o')onSet(t);
});
document.addEventListener('focusin',function(ev){if(ev.target.matches&&ev.target.matches('input,textarea'))typing=true;});
document.addEventListener('focusout',function(){
  typing=false;
  setTimeout(function(){if(!typing&&pendingRender){pendingRender=false;if(!document.getElementById('sheet').classList.contains('on'))rerenderKeep();}},180);
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&ev.target.matches&&ev.target.matches('input.inp,input.sinp'))ev.target.blur();
  if(ev.key==='Escape')closeSheet();
});
document.addEventListener('pointerdown',function(ev){if(ev.target.closest&&ev.target.closest('#wsvg'))chartTap(ev);});
document.addEventListener('pointermove',function(ev){if((ev.buttons||ev.pointerType==='touch')&&ev.target.closest&&ev.target.closest('#wsvg'))chartTap(ev);});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible'){if(saveT)saveNow();return;}
  restTick();
  if(lastToday!==today()){if(cur===lastToday)cur=today();if(!typing)rerenderKeep();}
  if(syncOn())syncNow(true);
});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;if(TAB==='bugun'&&S.profile.startDate&&!typing)rerenderKeep();});
window.addEventListener('pagehide',function(){if(saveT)saveNow();});

/* ============ AÇILIŞ ============ */
load();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if(syncOn())setTimeout(function(){syncNow(true);},800);
pushVerify();

})();
</script>
